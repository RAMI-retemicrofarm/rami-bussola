# .github/workflows/ci.yml — la CI della Bussola, dal modello della Bottega. Gira nel repo pubblico di RAMI, che ha
# `codice/` come radice. Le action sono all'ultima versione maggiore del 18/10/2026.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # La scansione dei segreti a ogni push, su tutta la storia. gitleaks-action chiede una licenza per i repo delle
  # organizzazioni: si usa il binario ufficiale (MIT), con l'impronta della release controllata.
  segreti:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1

  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Le E2E sulla vetrina unita, servita da `wrangler pages dev` come su Pages, coi browser dei progetti.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
